apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pmts-api
  template:
    metadata:
      labels:
        app: pmts-api
    spec:
      containers:
        - name: api
          image: pmts-api:local
          imagePullPolicy: Never   # image is built straight into minikube's Docker daemon
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
          readinessProbe:
            httpGet: { path: /health/db, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pmts-api
spec:
  type: NodePort
  selector:
    app: pmts-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
